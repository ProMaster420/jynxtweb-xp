<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#05060a" />
    <meta name="description" content="jynxt - a Windows XP-style personal music website" />
    <title>jynxt</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>

  <body>
    <!-- Intro Screen -->
    <div id="intro">
      <div class="intro-label" id="intro-label">click to enter</div>
    </div>

    <!-- Login Screen -->
    <div id="login-screen">
      <div id="login-card" class="glass-card">
        <img id="login-avatar" src="/assets/optimized/avatars/profile1.webp" alt="jynxt" />
        <h1 id="login-title">jynxt</h1>
        <p id="login-subtitle">double-tap to enter</p>
        <button id="login-btn" class="win-button">enter</button>
      </div>
    </div>

    <!-- Vignette Overlay -->
    <div id="vignette"></div>

    <!-- Wallpaper Background -->
    <div id="wallpapers" aria-hidden="true"></div>

    <!-- Mute Button -->
    <button id="mute-btn" type="button" data-no-reveal aria-label="Mute" class="win-button small">
      <img id="mute-icon" src="/assets/volume on.png" alt="" draggable="false" />
    </button>

    <!-- Desktop Environment -->
    <div id="desktop">
      <!-- Desktop Icons -->
      <div id="desktop-icons">
        <div class="desktop-icon" data-app="profile">
          <div class="desktop-icon-content">
            <img src="/assets/optimized/avatars/profile1.webp" alt="Profile" />
          </div>
          <div class="desktop-icon-label">jynxt</div>
        </div>
        <div class="desktop-icon" data-app="gallery">
          <div class="desktop-icon-content">
            <img src="/assets/optimized/wallpapers/default.webp" alt="Gallery" />
          </div>
          <div class="desktop-icon-label">gallery</div>
        </div>
        <div class="desktop-icon" data-app="music">
          <div class="desktop-icon-content">
            <img src="/assets/optimized/wallpapers/wallpaper1.webp" alt="Music" />
          </div>
          <div class="desktop-icon-label">music</div>
        </div>
        <div class="desktop-icon" data-app="wallpaper">
          <div class="desktop-icon-content">
            <img src="/assets/optimized/wallpapers/wallpaper2.webp" alt="Wallpaper" />
          </div>
          <div class="desktop-icon-label">wallpaper</div>
        </div>
      </div>
    </div>

    <!-- Content Windows -->
    <div id="content">
      <div id="windows-container"></div>
    </div>

    <!-- Taskbar -->
    <div id="taskbar" data-no-reveal>
      <div id="taskbar-start-button">
        <span id="start-btn">START</span>
      </div>
      <div id="taskbar-taskbar">
        <div class="taskbar-spacer"></div>
        <div id="taskbar-clock">00:00 AM</div>
      </div>
    </div>

    <!-- Start Menu -->
    <div id="start-menu" class="start-menu">
      <div class="start-menu-content">
        <div class="start-menu-user">
          <img src="/assets/optimized/avatars/profile1.webp" alt="" />
          <span>jynxt</span>
        </div>
        <div class="start-menu-separator"></div>
        <div class="start-menu-item" data-action="profile">Profile</div>
        <div class="start-menu-item" data-action="gallery">Gallery</div>
        <div class="start-menu-item" data-action="music">Music Player</div>
        <div class="start-menu-item" data-action="wallpaper">Wallpaper</div>
      </div>
    </div>

    <!-- Music Player Island -->
    <div id="island" class="music-island glass-card" data-no-reveal>
      <audio id="audio" preload="none" playsinline></audio>
      <div id="cover" class="music-cover-tile">♪</div>
      <div class="island-meta">
        <div id="track-title" class="track-title"></div>
        <div id="track-artist" class="track-artist"></div>
      </div>
      <div class="island-controls">
        <button type="button" id="prev-btn" aria-label="Previous">⏮</button>
        <button type="button" id="play-btn" aria-label="Play">▶</button>
        <button type="button" id="next-btn" aria-label="Next">⏭</button>
      </div>
    </div>

    <!-- Annotation Overlay -->
    <div id="annotation-overlay" class="annotation-overlay">
      <div id="annotation-container">
        <div id="annotation-content">
          <div class="annotation-header">
            <h2 id="annotation-title"></h2>
            <span id="annotation-artist"></span>
            <button id="annotation-close" aria-label="Close">✕</button>
          </div>
          <div id="annotation-cover" class="annotation-cover"></div>
          <div id="annotation-lyrics" class="annotation-lyrics"></div>
          <div class="annotation-text" id="annotation-text"></div>
          <div class="annotation-action">
            <a id="annotation-full-link" target="_blank" rel="noopener noreferrer"></a>
            <a id="annotation-genius-link" target="_blank" rel="noopener noreferrer"></a>
          </div>
        </div>
      </div>
    </div>

    <!-- Main Scripts -->
    <script src="/fonts.js" type="module"></script>
    <script src="/script.js" type="module"></script>
  </body>
</html>
