<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jynxt - Windows XP</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Background Wallpaper -->
  <div id="desktop">
    <img class="wallpaper" src="assets/optimized/wallpapers/Bliss.webp" alt="Windows XP">
  </div>

  <!-- Desktop Icons -->
  <div id="desktop-icons">
    <div class="desktop-icon" data-file="My Documents">
      <div class="icon-frame">
        <div class="system-icon my-documents"></div>
      </div>
      <div class="icon-label">My Documents</div>
    </div>
    <div class="desktop-icon" data-file="My Music">
      <div class="icon-frame">
        <div class="system-icon my-music"></div>
      </div>
      <div class="icon-label">My Music</div>
    </div>
    <div class="desktop-icon" data-file="My Pictures">
      <div class="icon-frame">
        <div class="system-icon my-pictures"></div>
      </div>
      <div class="icon-label">My Pictures</div>
    </div>
    <div class="desktop-icon" data-file="Recycle Bin">
      <div class="icon-frame">
        <div class="system-icon recycle-bin"></div>
      </div>
      <div class="icon-label">Recycle Bin</div>
    </div>
    <div class="desktop-icon" data-app="profile">
      <div class="icon-frame">
        <img class="app-icon" src="assets/optimized/icons/profile-icon.webp" alt="jynxt">
      </div>
      <div class="icon-label">jynxt</div>
    </div>
  </div>

  <!-- Taskbar -->
  <div id="taskbar">
    <div id="start-btn-area">
      <button id="start-btn">
        <img class="start-logo" src="assets/optimized/icons/windows-xp.webp" alt="Start">
        <span class="start-text">START</span>
      </button>
    </div>
    <div class="taskbar-spacer"></div>
    <div id="quick-launch">
      <div class="ql-item">?</div>
    </div>
    <div id="taskbar-clock">00:00 PM</div>
  </div>

  <!-- Start Menu -->
  <div id="start-menu">
    <div class="start-user">
      <img class="start-avatar" src="assets/optimized/avatars/profile1.webp" alt="">
      <span class="start-name">jynxt</span>
    </div>
    <div class="start-separator"></div>
    <div class="start-item" data-action="profile">Profile</div>
    <div class="start-item" data-action="gallery">Gallery</div>
    <div class="start-item" data-action="music">Music Player</div>
    <div class="start-item" data-action="wallpaper">Wallpaper</div>
  </div>

  <!-- Windows Container -->
  <div id="windows-container"></div>

  <!-- Welcome Screen -->
  <div id="welcome-screen">
    <div id="xp-logo">
      <img src="assets/optimized/icons/windows-xp.webp" alt="Windows XP">
    </div>
    <div id="welcome-dialog">
      <div id="welcome-panel">
        <div class="avatar-container">
          <img id="user-avatar" class="avatar" src="assets/optimized/avatars/profile1.webp" alt="jynxt">
        </div>
        <h1 id="user-name">jynxt</h1>
        <p id="welcome-text">Welcome</p>
        <button id="enter-btn">Enter</button>
      </div>
    </div>
    <div id="xp-version">
      <span>Windows XP</span>
    </div>
  </div>

  <script src="script.js" type="module"></script>
</body>
</html>
